# Standard MCCS 2.2 codes. Lookups fall back to these when the active profile
# doesn't list a code. Spec facts only; anything Dell-specific goes in a profile.

[[code]]
vcp = 0x02
name = "new-control-value"
provenance = "spec"
note = "Set to 0x02 by the panel when a control changes; write 0x01 to acknowledge."

[[code]]
vcp = 0x04
name = "restore-factory"
provenance = "spec"
note = "Write any non-zero value to restore every factory default."

[[code]]
vcp = 0x05
name = "restore-brightness"
provenance = "spec"
note = "Write any non-zero value to restore factory brightness and contrast."

[[code]]
vcp = 0x08
name = "restore-color"
provenance = "spec"
note = "Write any non-zero value to restore factory colour settings."

[[code]]
vcp = 0x10
name = "brightness"
provenance = "spec"

[[code]]
vcp = 0x12
name = "contrast"
provenance = "spec"

[[code]]
vcp = 0x14
name = "color-preset"
provenance = "spec"
values = "0x01=srgb, 0x02=native, 0x03=4000k, 0x04=5000k, 0x05=6500k, 0x06=7500k, 0x07=8200k, 0x08=9300k, 0x09=10000k, 0x0A=11500k, 0x0B=user1, 0x0C=user2, 0x0D=user3"

[[code]]
