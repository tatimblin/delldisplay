# From DDPM's model tables; not measured.

[panel]
models = ["DELL U3421WE"]

[[code]]
vcp = 0x60
name = "input"
provenance = "inferred"
values = "0x0F=dp1, 0x11=hdmi1, 0x12=hdmi2, 0x1B=usb-c1"
note = "DDPM's input allow-list for this model; it refuses any other code before it reaches the wire."

[[code]]
vcp = 0xE8
name = "pip-sub-source"
provenance = "inferred"
note = "Three 5-bit input codes packed as sub1 | sub2<<5 | sub3<<10, which DDPM limits to 0x0F, 0x11, 0x12, 0x1B or 0 on this model."
