[package]
name = "ddc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Command-line control for Dell monitors over DDC/CI."
publish = false

[[bin]]
name = "delldisplay"
path = "src/main.rs"
# ddc-ffi's library is also called delldisplay; skip the bin so `cargo doc` doesn't collide.
doc = false

# Built by `dist` despite publish = false (the name is taken on crates.io).
[package.metadata.dist]
dist = true
formula = "delldisplay"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ddc-core = { path = "../ddc-core" }
ddc-transport = { path = "../ddc-transport" }
rmcp = { version = "3.4", default-features = false, features = ["server", "transport-io"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "io-std", "macros", "sync"], optional = true }
toml = { version = "0.9", optional = true }

[features]
default = ["mcp"]
# `delldisplay mcp`: the MCP server for AI agents. Off leaves out rmcp and tokio.
mcp = ["dep:rmcp", "dep:tokio", "dep:toml"]

[dev-dependencies]
ddc-core = { path = "../ddc-core", features = ["fixture"] }
ddc-transport = { path = "../ddc-transport", features = ["testing"] }
