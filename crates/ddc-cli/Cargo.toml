[package]
name = "ddc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Command-line control for Dell monitors over DDC/CI."
publish = false

[[bin]]
name = "delldisplay"
path = "src/main.rs"
# ddc-ffi's library is also called delldisplay; skip the bin so `cargo doc` doesn't collide.
doc = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ddc-core = { path = "../ddc-core" }
ddc-transport = { path = "../ddc-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
ddc-core = { path = "../ddc-core", features = ["fixture"] }
ddc-transport = { path = "../ddc-transport", features = ["testing"] }
