name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Build both architectures
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$t" -p ddc-cli -p ddc-ffi
          done

      - name: Package
        run: |
          v="${GITHUB_REF_NAME}"
          a=target/aarch64-apple-darwin/release
          x=target/x86_64-apple-darwin/release

          cli="delldisplay-$v-macos-universal"
          mkdir -p "dist/$cli"
          lipo -create "$a/delldisplay" "$x/delldisplay" -output "dist/$cli/delldisplay"
          lipo -info "dist/$cli/delldisplay"
          cp LICENSE README.md "dist/$cli/"

          lib="libdelldisplay-$v-macos-universal"
          mkdir -p "dist/$lib"
          lipo -create "$a/libdelldisplay.dylib" "$x/libdelldisplay.dylib" -output "dist/$lib/libdelldisplay.dylib"
          lipo -create "$a/libdelldisplay.a" "$x/libdelldisplay.a" -output "dist/$lib/libdelldisplay.a"
          cp crates/ddc-ffi/include/delldisplay.h LICENSE "dist/$lib/"

          cd dist
          for d in "$cli" "$lib"; do
            tar -czf "$d.tar.gz" "$d"
            shasum -a 256 "$d.tar.gz" > "$d.tar.gz.sha256"
          done
          ./"$cli"/delldisplay --help > /dev/null

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md). macOS universal binaries, unsigned: run \`xattr -dr com.apple.quarantine <dir>\` after extracting a browser download."
